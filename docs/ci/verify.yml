name: Verify
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: linework_test
          POSTGRES_PASSWORD: linework_test
          POSTGRES_DB: linework_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U linework_test -d linework_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm install --global pnpm@12.14.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
        env:
          TEST_DATABASE_URL: postgres://linework_test:linework_test@localhost:5432/linework_test
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
